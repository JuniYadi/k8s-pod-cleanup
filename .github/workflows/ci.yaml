name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-go:
    name: Test Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: src/go.sum
      - name: Run Go Vet & Race Tests
        working-directory: src
        run: |
          go vet ./...
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/coverage.out

  lint-helm:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Lint Chart
        run: |
          helm lint chart/k8s-pod-cleanup

      - name: Test Template Rendering
        run: |
          helm template test chart/k8s-pod-cleanup --debug

  build-docker-dryrun:
    name: Test Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (No Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Both architectures, deliberately without setting up QEMU: the
          # Dockerfile cross-compiles, so a regression that reintroduces
          # emulation fails here instead of adding ten minutes to a release.
          platforms: linux/amd64,linux/arm64
          push: false
          tags: k8s-pod-cleanup:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
