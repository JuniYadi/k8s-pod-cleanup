name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-docker:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release-helm-chart:
    name: Package & Release Helm Chart
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Update Chart Version & AppVersion
        run: |
          sed -i 's/^version:.*/version: ${{ steps.get_version.outputs.version }}/g' chart/k8s-pod-cleanup/Chart.yaml
          sed -i 's/^appVersion:.*/appVersion: "${{ steps.get_version.outputs.version }}"/g' chart/k8s-pod-cleanup/Chart.yaml
          sed -i 's/tag: .*/tag: "${{ steps.get_version.outputs.version }}"/g' chart/k8s-pod-cleanup/values.yaml

      - name: Package Helm Chart
        run: |
          mkdir -p .cr-release-packages
          helm package chart/k8s-pod-cleanup --destination .cr-release-packages

      - name: Log in to GHCR for Helm OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Helm Chart OCI to GHCR
        run: |
          # Convert repository owner to lowercase for GHCR OCI
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          helm push .cr-release-packages/k8s-pod-cleanup-${{ steps.get_version.outputs.version }}.tgz oci://ghcr.io/${REPO_LOWER}/charts

      - name: Create GitHub Release with Chart Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          files: |
            .cr-release-packages/k8s-pod-cleanup-${{ steps.get_version.outputs.version }}.tgz
          generate_release_notes: true
