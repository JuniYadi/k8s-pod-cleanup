# Default values for k8s-pod-cleanup.

schedule: "*/5 * * * *"
concurrencyPolicy: Forbid
restartPolicy: OnFailure
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

image:
  repository: ghcr.io/juniyadi/k8s-pod-cleanup
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automountServiceAccountToken: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC resources (ClusterRole & ClusterRoleBinding) should be created
  create: true

cleanup:
  # When true, logs the pods to be cleaned up without actually deleting them
  dryRun: false
  # When true, force deletes pods immediately (gracePeriodSeconds=0)
  force: false
  # Minimum age duration before an unhealthy pod is considered for cleanup
  thresholdDuration: "5m"
  # Threshold for pods stuck in Terminating status
  terminatingThreshold: "5m"
  # Number of container restarts required for CrashLoopBackOff/ImagePullBackOff detection
  restartThreshold: 3
  # Annotation or label key used to ignore pods from cleanup
  ignoreAnnotation: "cleanup.k8s.io/ignore"
  # Log level (debug, info, warn, error)
  logLevel: "info"
  # Specific namespaces to scan (empty list means all namespaces)
  namespaces: []
  # Namespaces excluded from cleanup
  excludedNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease


# Node Pressure Pod Evacuation CronJob configuration
nodePressureEviction:
  # Enable or disable the dedicated fast CronJob for node pressure pod evacuation
  enabled: true
  # Schedule for node pressure checks (default: every 2 minutes)
  schedule: "*/2 * * * *"
  # When true, logs what would be cordoned/evicted without modifying nodes/pods
  dryRun: false
  # Minimum duration a node must experience sustained pressure before evacuating pods
  pressureDuration: "1m"
  # Force delete pods immediately (gracePeriodSeconds=0) when evacuating from pressured node
  forceDelete: true
  # Cordon the node (mark unschedulable) when sustained pressure is detected
  cordon: true
  # Concurrency policy for the node pressure cronjob
  concurrencyPolicy: Forbid
  # History limits
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Custom resources for node pressure job container if different from default
  resources: {}
# Prometheus metrics, pushed to a Pushgateway at the end of every run.
# A CronJob pod exits long before Prometheus could scrape it, so push is the
# only option short of turning this into a long-running controller.
metrics:
  enabled: false
  pushgateway:
    # Base URL of the Pushgateway. Required when metrics.enabled is true.
    url: "http://prometheus-pushgateway.monitoring.svc:9091"
    # Prometheus job name, used as the grouping key. Each CronJob additionally
    # pushes under its own "component" label (pod-cleanup / node-pressure), so
    # the two do not overwrite each other.
    jobName: "k8s-pod-cleanup"
    auth:
      # Name of an existing Secret holding PUSHGATEWAY_USERNAME and
      # PUSHGATEWAY_PASSWORD keys. Left empty, no credentials are sent.
      # Credentials are deliberately not inline values: values.yaml usually
      # ends up in Git, and container args are readable by anyone who can read
      # the pod spec.
      existingSecret: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

nodeSelector: {}
tolerations: []
affinity: {}
